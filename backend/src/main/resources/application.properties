spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/spadb
spring.datasource.username=root
spring.datasource.password=

#esta linea la usamos para que cree la base de datos si no esta creada
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true

#linea para traducir el lenguaje de la base de datos y el programa entienda el code
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080